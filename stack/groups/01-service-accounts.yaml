template:
  path: service_accounts.yaml

entries:
  - user_name: PROVISION_APP_SVC
    login_name: PROVISION_APP_SVC
    display_name: Provision App Service Account
    comment: Service account provisioned via Provision Tool
    default_warehouse: PROVISION_APP_WH
    default_role: FR_PROVISION_APP
    default_secondary_roles: ["ALL"]
    disabled: false
    must_change_password: false