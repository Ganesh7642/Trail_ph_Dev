# Grants roles to FR_PROVISION_APP and assigns warehouse privileges
# so all functional-role membership is managed in one place.

template:
  path: functional_role_membership.yaml

entries:
  - functional_role: FR_PROVISION_APP
    # Roles granted into FR_PROVISION_APP
    granted_roles:
      - name: OBJ_DB_DEVELOPMENT_USE
      - name: OBJ_DB_DEVELOPMENT_SELECT

    # Warehouse-level privileges for FR_PROVISION_APP and related roles
    warehouse_grants:
      - warehouse: PROVISION_APP_WH
        role_name: FR_PROVISION_APP
        privileges:
          - USAGE
          - OPERATE

      - warehouse: PROVISION_APP_WH
        role_name: USER_PLATFORM_OPS
        privileges:
          - USAGE