warehouses:
  - name: {{ wh_name }}
    properties:
{% if wh_type is truthy %}
      warehouse_type: {{ wh_type }}
{% endif %}
{% if wh_size is truthy %}
      warehouse_size: {{ wh_size }}
{% endif %}
{% if resource_type is truthy %}
      resource_constraint: {{ resource_type }}
{% endif %}
{% if auto_suspend is truthy %}
      auto_suspend: {{ auto_suspend }}
{% endif %}
{% if auto_resume is not none %}
      auto_resume: {{ auto_resume }}
{% endif %}
{% if initially_suspended is not none %}
      initially_suspended: {{ initially_suspended }}
{% endif %}
{% if statement_queued_timeout_in_seconds is truthy %}
      statement_queued_timeout_in_seconds: {{ statement_queued_timeout_in_seconds }}
{% endif %}
{% if statement_timeout_in_seconds is truthy %}
      statement_timeout_in_seconds: {{ statement_timeout_in_seconds }}
{% endif %}
{% if comment is truthy %}
      comment: "{{ comment }}"
{% endif %}
{% if resource_monitor is truthy %}
      resource_monitor: {{ resource_monitor }}
{% endif %}